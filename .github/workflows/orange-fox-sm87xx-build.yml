name: OrangeFox 16 Builder - sm87xx (Ace5Pro / Pad2Pro)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Maximize build space
        uses: easimon/maximize-build-space@master

      - name: Setup environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y repo git python3 unzip
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Setup swap
        run: |
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Sync OrangeFox fox_16.0 sources
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workspace"
          cd "$GITHUB_WORKSPACE/workspace"
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0
          (while true; do echo "Syncing OrangeFox sources..."; sleep 60; done) &
          TIP_PID=$!
          repo sync -c --force-sync --no-tags
          kill $TIP_PID || true

      - name: Setup device tree
        run: |
          cd "$GITHUB_WORKSPACE/workspace"
          git clone https://github.com/kiduserzxl/twrp_device_oplus_sm87xx -b twrp-16.0 device/oplus/sm87xx

      - name: Build OrangeFox recovery
        run: |
          cd "$GITHUB_WORKSPACE/workspace"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=sm87xx
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_sm87xx-eng || lunch twrp_sm87xx-ap2a-eng || lunch twrp_sm87xx
          (while true; do echo "$(date +%T) Building OrangeFox..."; sleep 60; done) &
          TIP_PID=$!
          mka adbd recoveryimage || m recoveryimage
          kill $TIP_PID || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-sm87xx-Ace5Pro-Pad2Pro
          path: |
            workspace/out/target/product/sm87xx/*.img
          if-no-files-found: error
