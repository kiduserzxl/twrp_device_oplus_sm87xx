name: OrangeFox 16 Builder - sm87xx (Ace5Pro / Pad2Pro)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Maximize build space
        uses: easimon/maximize-build-space@master

      - name: Setup environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          df -h /
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo apt update
          sudo apt install -y --no-install-recommends repo git python3 unzip
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Setup zram (no disk usage)
        run: |
          sudo modprobe zram || true
          sudo apt install -y --no-install-recommends zram-tools || true
          sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap 2>/dev/null || true
          sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap 2>/dev/null || true
          sudo systemctl restart zramswap 2>/dev/null || true
          zramctl || true
          free -h

      - name: Sync OrangeFox fox_16.0 sources
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workspace"
          cd "$GITHUB_WORKSPACE/workspace"
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0
          (while true; do echo "Syncing OrangeFox sources..."; sleep 60; done) &
          TIP_PID=$!
          n=0
          until repo sync -c --force-sync --no-tags --optimized-fetch -j 4; do
            n=$((n+1))
            if [ "$n" -ge 5 ]; then echo "Sync failed after 5 attempts"; exit 1; fi
            echo "Sync attempt $n failed, retrying in 15s..."; sleep 15
          done
          kill $TIP_PID || true

      - name: Setup device tree
        run: |
          cd "$GITHUB_WORKSPACE/workspace"
          git clone https://github.com/kiduserzxl/twrp_device_oplus_sm87xx -b fox-sm87xx device/oplus/sm87xx

      - name: Patch SELinux policy for recovery
        run: |
          cd "$GITHUB_WORKSPACE/workspace"
          # fox_16.0 source is missing hal_hwcrypto* attribute declarations.
          # Declare EVERY hal_hwcrypto* attribute that is referenced but missing
          # (.te/.conf use ";" syntax, .cil uses CIL "()" syntax)
          for F in $(grep -rl 'hal_hwcrypto' system/sepolicy/ 2>/dev/null); do
            case "$F" in
              *.cil)
                grep -oP '\(typeattribute\s+\S+\s+hal_hwcrypto\w*\)' "$F" 2>/dev/null | sed -E 's/^\(typeattribute[[:space:]]+[^ ]+[[:space:]]+//; s/\)$//' | sort -u | while read A; do
                  if ! grep -q "(attribute $A)" "$F"; then
                    sed -i "1i (attribute $A)" "$F"
                    echo "CIL_DECLARED: $F -> $A"
                  fi
                done
                ;;
              *)
                grep -oP 'typeattribute\s+\S+\s+hal_hwcrypto\w*;' "$F" 2>/dev/null | sed -E 's/^typeattribute[[:space:]]+[^ ]+[[:space:]]+//; s/;$//' | sort -u | while read A; do
                  if ! grep -q "^attribute $A;" "$F"; then
                    sed -i "1i attribute $A;" "$F"
                    echo "CONF_DECLARED: $F -> $A"
                  fi
                done
                ;;
            esac
          done
          # Force ninja to rebuild every sepolicy intermediate from the patched sources
          find out -path '*sepolicy*' -delete 2>/dev/null || true
          echo "=== sepolicy intermediates cleared ==="

      - name: Build OrangeFox recovery
        run: |
          cd "$GITHUB_WORKSPACE/workspace"
          export ALLOW_MISSING_DEPENDENCIES=true
          export SKIP_ABI_CHECKS=true
          export FOX_BUILD_DEVICE=sm87xx
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_sm87xx-eng || lunch twrp_sm87xx-ap2a-eng || lunch twrp_sm87xx
          (while true; do echo "$(date +%T) Building OrangeFox..."; sleep 60; done) &
          TIP_PID=$!
          mka adbd recoveryimage || m recoveryimage
          kill $TIP_PID || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-sm87xx-Ace5Pro-Pad2Pro
          path: |
            workspace/out/target/product/sm87xx/*.img
          if-no-files-found: error
