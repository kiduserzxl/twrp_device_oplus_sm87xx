name: OrangeFox 16 Builder - Ace5Pro (dodge-based)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Maximize build space
        uses: easimon/maximize-build-space@master

      - name: Setup environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          df -h /
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo apt update
          sudo apt install -y --no-install-recommends repo git python3 unzip
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Setup zram (no disk usage)
        run: |
          sudo modprobe zram || true
          sudo apt install -y --no-install-recommends zram-tools || true
          sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap 2>/dev/null || true
          sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap 2>/dev/null || true
          sudo systemctl restart zramswap 2>/dev/null || true
          zramctl || true
          free -h

      - name: Sync OrangeFox fox_16.0 sources
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workspace"
          cd "$GITHUB_WORKSPACE/workspace"
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0
          # OrangeFox's fox.xml already removes the AOSP platform/external/libvpx
          # and libwebm and re-adds its own forks (remote=OrangeFox). Those forks
          # now 404 on GitLab (upstream removed the repos) which kills the sync.
          # Recovery does not use these media codec libs, so drop the forks from
          # the final project list. NOTE: the names here are the ones that exist
          # in the final merged manifest (external/...), NOT platform/external/...
          mkdir -p .repo/local_manifests
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<manifest>' '  <remove-project name="external/libvpx" />' '  <remove-project name="external/libwebm" />' '</manifest>' > .repo/local_manifests/drop-media.xml
          cat .repo/local_manifests/drop-media.xml
          (while true; do echo "Syncing OrangeFox sources..."; sleep 60; done) &
          TIP_PID=$!
          n=0
          until repo sync -c --force-sync --no-tags --optimized-fetch -j 4; do
            n=$((n+1))
            if [ "$n" -ge 10 ]; then echo "Sync failed after 10 attempts"; kill $TIP_PID || true; exit 1; fi
            echo "Sync attempt $n failed, retrying in 20s..."; sleep 20
          done
          kill $TIP_PID || true

      - name: Setup device tree (OrangeFox dodge + Ace5Pro params)
        run: |
          cd "$GITHUB_WORKSPACE/workspace"
          # Official OrangeFox tree for OnePlus 13 (dodge, sm8750) - same platform as Ace5Pro
          git clone https://gitlab.com/OrangeFox/device/dodge -b fox_14.1 device/oneplus/dodge
          cd device/oneplus/dodge

          # --- device codename + model ---
          sed -i 's/^PRODUCT_DEVICE *:= *dodge/PRODUCT_DEVICE := PKR110/' twrp_dodge.mk
          sed -i 's/^PRODUCT_MODEL *:= *OnePlus 13/PRODUCT_MODEL := OnePlus Ace5 Pro/' twrp_dodge.mk

          # --- device identification strings (getprop ro.product.model on device) ---
          sed -i 's/TARGET_DEVICE_ALT="PJZ110,OP5D55L1,OP5D0DL1,CPH2649,CPH2653,CPH2655"/TARGET_DEVICE_ALT="PKR110,OPD2413"/' vendorsetup.sh

          # --- Ace5 Pro dynamic partition sizes (BOARD_SUPER_PARTITION_SIZE) ---
          sed -i 's/^BOARD_SUPER_PARTITION_SIZE *:= *15354134528/BOARD_SUPER_PARTITION_SIZE := 14077349888/' BoardConfig.mk
          sed -i 's/^BOARD_QTI_DYNAMIC_PARTITIONS_SIZE *:= *15349940224/BOARD_QTI_DYNAMIC_PARTITIONS_SIZE := 14073155584/' BoardConfig.mk
          sed -i 's/^OF_DYNAMIC_FULL_SIZE *:= *15354134528/OF_DYNAMIC_FULL_SIZE := 14077349888/' fox_dodge.mk

          # --- recovery version tag ---
          sed -i 's/^TW_DEVICE_VERSION *:= *OnePlus_13/TW_DEVICE_VERSION := OPLUS-SM87XX/' BoardConfig.mk

          # --- Android 16 CrashRecovery apex: declare system server jar (required by fox_16.0 manifest) ---
          echo 'PRODUCT_APEX_SYSTEM_SERVER_JARS += com.android.crashrecovery.systemserverclasspath.fragment:service-crashrecovery' >> device.mk

          echo "=== patched twrp_dodge.mk ==="
          grep -E 'PRODUCT_(DEVICE|NAME|MODEL)' twrp_dodge.mk
          echo "=== patched BoardConfig.mk ==="
          grep -E 'BOARD_SUPER_PARTITION_SIZE|BOARD_QTI_DYNAMIC_PARTITIONS_SIZE|TW_DEVICE_VERSION' BoardConfig.mk
          echo "=== patched fox_dodge.mk ==="
          grep -E 'OF_DYNAMIC_FULL_SIZE' fox_dodge.mk
          echo "=== patched vendorsetup.sh ==="
          grep -E 'TARGET_DEVICE_ALT' vendorsetup.sh
          echo "=== patched device.mk tail ==="
          tail -3 device.mk

      - name: Build OrangeFox recovery
        run: |
          cd "$GITHUB_WORKSPACE/workspace"
          export ALLOW_MISSING_DEPENDENCIES=true
          export SKIP_ABI_CHECKS=true
          export FOX_BUILD_DEVICE=dodge
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_dodge-eng || lunch twrp_dodge
          (while true; do echo "$(date +%T) Building OrangeFox..."; sleep 60; done) &
          TIP_PID=$!
          mka adbd recoveryimage || m recoveryimage
          kill $TIP_PID || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Ace5Pro-PKR110
          path: |
            workspace/out/target/product/dodge/*.img
          if-no-files-found: error
