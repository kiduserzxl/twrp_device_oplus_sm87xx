name: OrangeFox 16 Builder - sm87xx (Ace5Pro / Pad2Pro)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Maximize build space
        uses: easimon/maximize-build-space@master

      - name: Setup environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          df -h /
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo apt update
          sudo apt install -y --no-install-recommends repo git python3 unzip
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Setup zram (no disk usage)
        run: |
          sudo modprobe zram || true
          sudo apt install -y --no-install-recommends zram-tools || true
          sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap 2>/dev/null || true
          sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap 2>/dev/null || true
          sudo systemctl restart zramswap 2>/dev/null || true
          zramctl || true
          free -h

      - name: Sync OrangeFox fox_16.0 sources
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workspace"
          cd "$GITHUB_WORKSPACE/workspace"
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0
          # OrangeFox's fox.xml already removes the AOSP platform/external/libvpx
          # and libwebm and re-adds its own forks (remote=OrangeFox). Those forks
          # now 404 on GitLab (upstream removed the repos) which kills the sync.
          # Recovery does not use these media codec libs, so drop the forks from
          # the final project list. NOTE: the names here are the ones that exist
          # in the final merged manifest (external/...), NOT platform/external/...
          mkdir -p .repo/local_manifests
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<manifest>' '  <remove-project name="external/libvpx" />' '  <remove-project name="external/libwebm" />' '</manifest>' > .repo/local_manifests/drop-media.xml
          cat .repo/local_manifests/drop-media.xml
          (while true; do echo "Syncing OrangeFox sources..."; sleep 60; done) &
          TIP_PID=$!
          n=0
          until repo sync -c --force-sync --no-tags --optimized-fetch -j 4; do
            n=$((n+1))
            if [ "$n" -ge 10 ]; then echo "Sync failed after 10 attempts"; kill $TIP_PID || true; exit 1; fi
            echo "Sync attempt $n failed, retrying in 20s..."; sleep 20
          done
          kill $TIP_PID || true

      - name: Setup device tree
        run: |
          cd "$GITHUB_WORKSPACE/workspace"
          git clone https://github.com/kiduserzxl/twrp_device_oplus_sm87xx -b fox-sm87xx device/oplus/sm87xx

      - name: Patch SELinux policy for recovery
        run: |
          cd "$GITHUB_WORKSPACE/workspace"
          # vendor_sepolicy build cannot see the hal_hwcrypto* attributes that are
          # declared in plat (private/attributes). Declare them ONLY in vendor-side
          # files -- never touch plat/private/public/prebuilts (they already declare
          # hal_hwcrypto and would then conflict).
          for F in $(grep -rl 'hal_hwcrypto' system/sepolicy/vendor/ 2>/dev/null); do
            grep -q '^attribute hal_hwcrypto;' "$F" || sed -i '1i attribute hal_hwcrypto;' "$F"
            grep -q '^attribute hal_hwcrypto_server;' "$F" || sed -i '1i attribute hal_hwcrypto_server;' "$F"
            echo "PATCHED_VENDOR: $F"
          done
          echo "=== patch done ==="
          head -4 system/sepolicy/vendor/hal_hwcrypto_default.te || true
          # Force ninja to rebuild every sepolicy intermediate from the patched sources
          find out -path '*sepolicy*' -delete 2>/dev/null || true
          echo "=== sepolicy intermediates cleared ==="

      - name: Build OrangeFox recovery
        run: |
          cd "$GITHUB_WORKSPACE/workspace"
          export ALLOW_MISSING_DEPENDENCIES=true
          export SKIP_ABI_CHECKS=true
          export FOX_BUILD_DEVICE=sm87xx
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_sm87xx-eng || lunch twrp_sm87xx-ap2a-eng || lunch twrp_sm87xx
          (while true; do echo "$(date +%T) Building OrangeFox..."; sleep 60; done) &
          TIP_PID=$!
          mka adbd recoveryimage || m recoveryimage
          kill $TIP_PID || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-sm87xx-Ace5Pro-Pad2Pro
          path: |
            workspace/out/target/product/sm87xx/*.img
          if-no-files-found: error
